<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Rain</title>
  <base href="/rain/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Rain: Algorand pots that drop on the people holding a ticket. Watch a rain, enter it, collect what it drops.">

  <!-- CorvidLabs design system: set the theme before first paint. -->
  <script>
    (() => {
      try {
        const q = new URLSearchParams(location.search).get("theme");
        const t = q || localStorage.getItem("corvid-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (_) {}
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="brand/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;900&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="brand/tokens.css">
</head>
<body>
  <app-root></app-root>
</body>
</html>
